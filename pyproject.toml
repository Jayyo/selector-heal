[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selector-heal"
version = "0.1.0"
description = "A synthetic benchmark for selective web-locator repair: pick the successor element or abstain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jay Cho" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
selector-heal = "selector_heal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
